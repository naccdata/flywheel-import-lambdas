[project]
name = "s3-flywheel-import"
version = "1.0.0"
description = "Lambda function for S3 to Flywheel copy-by-reference imports"
requires-python = ">=3.12"
dependencies = [
    "fw-client>=0.1.0",
    "boto3>=1.34.0",
    "awslambdaric>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "boto3-stubs[ssm,s3]>=1.34.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
